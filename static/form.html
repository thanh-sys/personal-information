<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    
  <form id="submit-form" method="post" class="form-box">
    <h2>Personal Information</h2>

    <div class="form-group">
      <label for="first-name">
        First name: <span class="required">*</span>
      </label>
      <input type="text" id="first-name" name="first_name" maxlength="30" style="text-transform: capitalize;" required>
      <p id="first-name-error" class="error"></p>
    </div>

    <div class="form-group">
      <label for="last-name">
        Last name: <span class="required">*</span>
      </label>
      <input type="text" id="last-name" name="last_name" maxlength="30" style="text-transform: capitalize;" required>
      <p id="last-name-error" class="error"></p>
    </div>

    <div class="form-group">
      <label class = "gender">Gender:</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" id="male-radio" value="male" checked> Male</label>
        <label><input type="radio" name="gender" id="female-radio" value="female"> Female</label>
      </div>
    </div>

   <div id="role-form-group" class="form-group">
      <label for="role">Role:</label>
      <select id="role-select" name="role">
        <option value="admin" selected>Admin</option>
        <option value="operator">Operator</option>
        <option value="user">User</option>
      </select>
    </div>

    <div class="form-group">
      <label for="favorite-sports">
        Favorite sports: <span class="required">*</span>
      </label>
      <div id= "checkbox-group" class="checkbox-group">
        <label><input type="checkbox" name="sports" value="football"> Football</label>
        <label><input type="checkbox" name="sports" value="basketball"> Basketball</label>
        <label><input type="checkbox" name="sports" value="badminton"> Badminton</label>
        <label><input type="checkbox" name="sports" value="swimming"> Swimming</label>
        <label><input type="checkbox" name="sports" value="cricket"> Cricket</label>
      </div>
      <p id="sports-error" class="error"></p>
    </div>

    <div class="submit-wrap">
      <button type="submit" id="submit-button" class="submit-btn">Submit</button>
      <button type="button" id="save-button" class="submit-btn">Save</button>
    </div>

    <div id="toast"></div>

  </form>
  
  <form class="form-box-add">

    <div id="add-role-group" class="form-group-2">
      <label for="add-role-input">
        Add role:
      </label> 
      <input type="text" id="add-role-input" name="add-role-input" style="text-transform: capitalize;">
      <button type="button" id="add-role-button" class="add-btn">Add Role</button>
      <p id="duplicate-role-error" class="error"></p>
    </div>

    <div id="add-sports-group" class="form-group-2">
      <label for="add-sport-input">
        Add sport:
      </label>
      <input type="text" id="add-sport-input" name="add-sport-input" style="text-transform: capitalize;">
      <button type="button" id="add-sport-button" class="add-btn">Add Sport</button>
      <p id="duplicate-sport-error" class="error"></p>
    </div>
    
  </form>
 
  <script type="module" src="/static/js/submitScript.js"></script>


</body>
</html>
